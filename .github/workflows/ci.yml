name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Python worker tests
        run: ./testing/python.sh
      - name: Local ingestion E2E
        run: ./testing/e2e/ingest-direct.sh
      - name: Structured conversation E2E
        run: ./testing/e2e/structured-conversation.sh
      - name: Fake model lifecycle E2E
        run: ./testing/e2e/model-fake.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: command -v rg >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y ripgrep; }
      - name: Documentation
        run: ./testing/docs.sh
